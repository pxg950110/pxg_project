server:
  port: 8082

spring:
  application:
    name: maidc-data
  datasource:
    url: jdbc:postgresql://localhost:5432/maidc?currentSchema=cdr&stringtype=unspecified
    username: maidc
    password: maidc123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: cdr
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: maidc123
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: maidc
    password: maidc123
    listener:
      simple:
        # 队列缺失时监听容器持续重试而非启动失败（队列由各服务 RabbitAdmin 声明，存在时序窗口）
        missing-queues-fatal: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        username: nacos
        password: nacos
      config:
        import-check:
          enabled: false

maidc:
  jwt:
    secret: maidc-jwt-secret-key-2026-change-in-production
  etl:
    csv-base-dir: E:/pxg_project/data/icu-datasets
    parallel: 3
    db-url: jdbc:postgresql://localhost:5432/maidc
    db-schema: ods
    db-user: maidc
    db-password: maidc123
    ddl-path: E:/pxg_project/docker/init-db

logging:
  level:
    com.maidc: INFO

# 专病知识库 AI 编排（maidc-aiworker 服务地址；LLM 在 ai-worker 侧配置）
diseasekb:
  ai-worker:
    base-url: http://localhost:8090
