# MAIDC Portal - 本地/内网 Docker 部署配置（HTTP）
server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到网关
    # 使用变量 + Docker DNS 动态解析：nginx 启动时只解析一次静态 upstream，
    # 后端容器重启换 IP 会导致 502；变量形式每次请求经 resolver 重新解析
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream gateway;
        proxy_pass http://$api_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        client_max_body_size 500m;
    }

    # WebSocket 代理到消息服务
    location /ws/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ws_upstream msg;
        proxy_pass http://$ws_upstream:8087;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
