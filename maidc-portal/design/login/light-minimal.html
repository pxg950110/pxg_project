<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方案B · 简洁浅色风 — MAIDC 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #0891b2;
    --primary-dark: #0e7490;
    --primary-soft: rgba(8, 145, 178, 0.1);
    --ink-1: #0f172a;
    --ink-2: #475569;
    --ink-3: #94a3b8;
    --line: #e2e8f0;
    --field-bg: #f8fafc;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #fbfcfe;
    color: var(--ink-1);
    min-height: 100vh;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* 背景装饰：克制的一笔淡青弧 + 圆点阵 */
  .deco-arc {
    position: absolute; top: -260px; right: -180px;
    width: 560px; height: 560px; border-radius: 50%;
    border: 70px solid rgba(8, 145, 178, 0.045);
    pointer-events: none;
  }
  .deco-arc2 {
    position: absolute; bottom: -220px; left: -160px;
    width: 460px; height: 460px; border-radius: 50%;
    border: 56px solid rgba(8, 145, 178, 0.035);
    pointer-events: none;
  }
  .deco-dots {
    position: absolute; top: 120px; left: 8%;
    width: 160px; height: 120px; pointer-events: none;
    background-image: radial-gradient(rgba(8, 145, 178, 0.18) 1.5px, transparent 1.5px);
    background-size: 18px 18px;
    mask-image: linear-gradient(135deg, #000, transparent 80%);
    -webkit-mask-image: linear-gradient(135deg, #000, transparent 80%);
  }

  /* 方案徽标 */
  .scheme-badge {
    position: fixed; top: 18px; right: 18px; z-index: 50;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px 7px 14px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--line);
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    font-size: 12px; color: var(--ink-2);
  }
  .scheme-badge b { color: var(--primary); font-weight: 600; }
  .scheme-badge a {
    color: var(--ink-2); text-decoration: none; padding: 4px 10px;
    border-radius: 999px; border: 1px solid var(--line); transition: 0.2s;
  }
  .scheme-badge a:hover { color: var(--primary); border-color: var(--primary); }

  /* 顶栏 logo */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 28px 40px;
  }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--primary), #2563eb);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .logo-name { font-size: 18px; font-weight: 700; letter-spacing: 1.5px; color: var(--ink-1); }

  /* 主体 */
  .main {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px 24px 40px;
    gap: 28px;
  }

  .hero { text-align: center; }
  .hero h1 { font-size: 26px; font-weight: 700; color: var(--ink-1); }
  .hero p { margin-top: 8px; font-size: 14px; color: var(--ink-3); }

  .card {
    width: 420px; max-width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 18px 44px rgba(15, 23, 42, 0.07);
    padding: 38px 36px 28px;
    display: flex; flex-direction: column; gap: 20px;
  }

  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .input-wrap { position: relative; }
  .input-wrap .lead {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: var(--ink-3); display: flex; pointer-events: none; transition: color 0.2s;
  }
  .input-wrap:focus-within .lead { color: var(--primary); }
  .field input {
    width: 100%; height: 44px;
    padding: 0 42px 0 40px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--field-bg);
    font-size: 14px; color: var(--ink-1); outline: none; font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .field input::placeholder { color: var(--ink-3); }
  .field input:hover { border-color: #cbd5e1; }
  .field input:focus {
    background: #fff;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .eye-btn {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: none; border-radius: 8px;
    background: transparent; color: var(--ink-3); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: 0.2s;
  }
  .eye-btn:hover { color: var(--ink-2); background: #f1f5f9; }

  .row-extra { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
  .remember { display: flex; align-items: center; gap: 8px; color: var(--ink-2); cursor: pointer; user-select: none; }
  .remember input { accent-color: var(--primary); width: 15px; height: 15px; cursor: pointer; }
  .forgot { color: var(--primary); text-decoration: none; font-weight: 500; }
  .forgot:hover { color: var(--primary-dark); text-decoration: underline; }

  .submit-btn {
    height: 46px; border: none; border-radius: 10px; cursor: pointer;
    background: var(--primary); color: #fff;
    font-size: 15px; font-weight: 600; letter-spacing: 6px; font-family: inherit;
    box-shadow: 0 4px 14px rgba(8, 145, 178, 0.28);
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .submit-btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(8, 145, 178, 0.36); }
  .submit-btn:active { transform: translateY(0); }

  .divider { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

  .sso-btn {
    height: 42px; border-radius: 10px; cursor: pointer; font-family: inherit;
    background: #fff; border: 1px solid var(--line);
    color: var(--ink-2); font-size: 13px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: 0.2s;
  }
  .sso-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

  .hints {
    display: flex; justify-content: center; gap: 18px;
    font-size: 12px; color: var(--ink-3);
  }
  .hints span { display: flex; align-items: center; gap: 5px; }
  .hints svg { color: var(--primary); }

  .foot {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 20px 0 26px; font-size: 12px; color: var(--ink-3);
  }
  .foot .links { display: flex; align-items: center; gap: 10px; }
  .foot a { color: var(--ink-2); text-decoration: none; }
  .foot a:hover { color: var(--primary); }

  @media (max-width: 480px) {
    .card { padding: 30px 22px 22px; }
    .hero h1 { font-size: 22px; }
    .deco-dots { display: none; }
  }
</style>
</head>
<body>
  <div class="deco-arc" aria-hidden="true"></div>
  <div class="deco-arc2" aria-hidden="true"></div>
  <div class="deco-dots" aria-hidden="true"></div>

  <div class="scheme-badge">
    <span>方案B · <b>简洁浅色风</b></span>
    <a href="index.html">返回对比</a>
  </div>

  <div class="page">
    <header class="topbar">
      <div class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12h4l2.5-6 4 12 3-8 1.8 4H22" />
        </svg>
      </div>
      <span class="logo-name">MAIDC</span>
    </header>

    <main class="main">
      <div class="hero">
        <h1>欢迎回来</h1>
        <p>登录 MAIDC 医疗AI数据中心，继续今天的工作</p>
      </div>

      <form class="card" onsubmit="return false">
        <div class="field">
          <label for="username">用户名</label>
          <div class="input-wrap">
            <span class="lead">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input id="username" type="text" placeholder="请输入用户名 / 工号" autocomplete="username" />
          </div>
        </div>

        <div class="field">
          <label for="password">密码</label>
          <div class="input-wrap">
            <span class="lead">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
            <button type="button" class="eye-btn" id="eyeBtn" aria-label="显示密码">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="row-extra">
          <label class="remember"><input type="checkbox" checked />记住我</label>
          <a class="forgot" href="javascript:void(0)">忘记密码?</a>
        </div>

        <button class="submit-btn" type="submit">登 录</button>

        <div class="divider">其他登录方式</div>

        <button class="sso-btn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
          医院统一认证登录
        </button>

        <div class="hints">
          <span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            等保三级
          </span>
          <span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            数据加密
          </span>
          <span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
            操作可审计
          </span>
        </div>
      </form>
    </main>

    <footer class="foot">
      <div class="links">
        <span>© 2026 MAIDC</span><span>·</span><a href="javascript:void(0)">隐私政策</a><span>·</span><a href="javascript:void(0)">使用条款</a><span>·</span><a href="javascript:void(0)">帮助中心</a>
      </div>
      <span>临床 + 科研一体化多中心医疗AI平台</span>
    </footer>
  </div>

<script>
  const pwd = document.getElementById('password');
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  const EYE_ON = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  const EYE_OFF = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  eyeBtn.addEventListener('click', () => {
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    eyeIcon.innerHTML = show ? EYE_OFF : EYE_ON;
    eyeBtn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
  });
</script>
</body>
</html>
