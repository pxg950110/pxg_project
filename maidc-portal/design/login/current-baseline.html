<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方案C · 现有风格基线 — MAIDC 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  }

  .scheme-badge {
    position: fixed; top: 18px; right: 18px; z-index: 50;
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px 7px 14px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    font-size: 12px; color: #475569;
  }
  .scheme-badge b { color: #0891b2; font-weight: 600; }
  .scheme-badge a {
    color: #475569; text-decoration: none; padding: 4px 10px;
    border-radius: 999px; border: 1px solid #e2e8f0; transition: 0.2s;
  }
  .scheme-badge a:hover { color: #0891b2; border-color: #0891b2; }

  /* ====== 以下复刻 src/views/login/LoginPage.vue 现状视觉 ====== */
  .login-page {
    min-height: 100vh;
    display: flex;
  }

  .login-left {
    width: 50%;
    min-width: 50%;
    position: relative;
    overflow: hidden;
    background: linear-gradient(158deg, #04293a 0%, #075063 48%, #0a6e8a 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .deco-glow { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; }
  .glow-a { width: 480px; height: 480px; left: -120px; top: -140px; background: rgba(45, 212, 191, 0.22); }
  .glow-b { width: 420px; height: 420px; right: -100px; bottom: -120px; background: rgba(56, 189, 248, 0.18); }

  .deco-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 30% 40%, #000 30%, transparent 75%);
    pointer-events: none;
  }

  .left-content {
    position: relative; padding: 60px 64px;
    display: flex; flex-direction: column; gap: 26px;
    width: 100%; max-width: 640px;
  }

  .logo-area { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 46px; height: 46px; border-radius: 13px;
    background: linear-gradient(135deg, rgba(45, 212, 191, 0.9), rgba(56, 189, 248, 0.9));
    display: flex; align-items: center; justify-content: center;
    color: #04293a; box-shadow: 0 6px 20px rgba(45, 212, 191, 0.35);
  }
  .logo-text { font-size: 26px; font-weight: 700; letter-spacing: 2px; }

  .brand-copy { display: flex; flex-direction: column; gap: 10px; }
  .welcome-title { font-size: 30px; font-weight: 700; line-height: 1.3; }
  .welcome-sub { font-size: 15px; color: rgba(255, 255, 255, 0.75); }

  .ecg-wrap {
    position: relative; height: 72px; margin: 2px 0; overflow: hidden;
    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  .ecg-svg { width: 200%; height: 100%; animation: ecg-scroll 9s linear infinite; }
  .ecg-path {
    fill: none; stroke: #2dd4bf; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(45, 212, 191, 0.6));
  }
  .ecg-glow { stroke: rgba(45, 212, 191, 0.25); stroke-width: 6; filter: none; }
  @keyframes ecg-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .feature-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .feature-card {
    display: flex; flex-direction: column; gap: 12px; padding: 18px 16px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 24px rgba(2, 24, 35, 0.25);
    animation: card-float 6s ease-in-out infinite;
  }
  .card-delay-1 { animation-delay: 1.2s; }
  .card-delay-2 { animation-delay: 2.4s; }
  @keyframes card-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .feature-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #5eead4;
    background: rgba(45, 212, 191, 0.14);
    border: 1px solid rgba(94, 234, 212, 0.25);
  }
  .feature-text { display: flex; flex-direction: column; gap: 3px; }
  .feature-title { font-size: 14px; font-weight: 600; color: rgba(255, 255, 255, 0.95); }
  .feature-sub { font-size: 12px; color: rgba(255, 255, 255, 0.6); }

  .version-tag { font-size: 12px; color: rgba(255, 255, 255, 0.4); }

  .login-right {
    flex: 1;
    background:
      radial-gradient(800px 500px at 85% -10%, rgba(8, 145, 178, 0.07), transparent 60%),
      radial-gradient(600px 400px at 0% 100%, rgba(37, 99, 235, 0.05), transparent 55%),
      #f8fafc;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
  }

  .login-form { width: 400px; max-width: 100%; display: flex; flex-direction: column; gap: 26px; }
  .form-header { display: flex; flex-direction: column; gap: 8px; }
  .form-title { font-size: 28px; font-weight: 700; color: #0f172a; }
  .form-subtitle { font-size: 14px; color: #64748b; }

  .form-fields { display: flex; flex-direction: column; gap: 18px; }
  .field-group { display: flex; flex-direction: column; gap: 7px; }
  .field-label { font-size: 13px; font-weight: 600; color: #334155; }
  .field-input {
    width: 100%; height: 44px; padding: 0 14px;
    border: 1px solid #e2e8f0; border-radius: 10px;
    font-size: 14px; color: #0f172a; background: #fff; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s; font-family: inherit;
  }
  .field-input::placeholder { color: #94a3b8; }
  .field-input:hover { border-color: #cbd5e1; }
  .field-input:focus { border-color: #0891b2; box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.14); }

  .password-wrapper { position: relative; }
  .password-input { padding-right: 44px; }
  .password-toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 8px; cursor: pointer;
    color: #94a3b8; transition: color 0.2s, background 0.2s;
  }
  .password-toggle:hover { color: #475569; background: #f1f5f9; }

  .form-extra { display: flex; align-items: center; justify-content: space-between; }
  .remember-me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #64748b; cursor: pointer; user-select: none; }
  .remember-me input[type='checkbox'] { width: 15px; height: 15px; accent-color: #0891b2; cursor: pointer; }
  .forgot-link { font-size: 13px; color: #0891b2; cursor: pointer; text-decoration: none; }
  .forgot-link:hover { color: #0e7490; text-decoration: underline; }

  .login-btn {
    width: 100%; height: 46px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0891b2 0%, #2563eb 100%);
    color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; letter-spacing: 4px; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, filter 0.2s; font-family: inherit;
    box-shadow: 0 4px 14px rgba(8, 145, 178, 0.3);
  }
  .login-btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(8, 145, 178, 0.4); }
  .login-btn:active { transform: translateY(0); }

  .divider { display: flex; align-items: center; gap: 14px; }
  .divider-line { flex: 1; height: 1px; background: #e2e8f0; }
  .divider-text { font-size: 12px; color: #94a3b8; white-space: nowrap; }

  .sso-btn {
    height: 42px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff;
    font-size: 13px; font-weight: 500; color: #475569; cursor: pointer;
    transition: border-color 0.2s, color 0.2s; font-family: inherit;
  }
  .sso-btn:hover { border-color: #0891b2; color: #0891b2; }

  .security-hints {
    display: flex; flex-direction: column; gap: 5px;
    padding: 12px 14px; background: #f8fafc;
    border: 1px dashed #e2e8f0; border-radius: 10px;
  }
  .security-hints p { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #94a3b8; }
  .security-hints svg { flex-shrink: 0; }

  .footer-links { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 12px; color: #94a3b8; }
  .footer-links a { color: #64748b; cursor: pointer; text-decoration: none; }
  .footer-links a:hover { color: #0891b2; text-decoration: underline; }

  @media (max-width: 960px) {
    .login-left { display: none; }
  }
  @media (max-width: 480px) {
    .login-form { width: 100%; }
    .form-title { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ecg-svg, .feature-card { animation: none; }
    .login-btn { transform: none; }
  }
</style>
</head>
<body>
  <div class="scheme-badge">
    <span>方案C · <b>现有风格基线</b></span>
    <a href="index.html">返回对比</a>
  </div>

  <div class="login-page">
    <!-- 左侧品牌墙 -->
    <div class="login-left">
      <div class="deco-glow glow-a" aria-hidden="true"></div>
      <div class="deco-glow glow-b" aria-hidden="true"></div>
      <div class="deco-grid" aria-hidden="true"></div>

      <div class="left-content">
        <div class="logo-area">
          <div class="logo-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12h4l2.5-6 4 12 3-8 1.8 4H22" />
            </svg>
          </div>
          <span class="logo-text">MAIDC</span>
        </div>

        <div class="brand-copy">
          <h1 class="welcome-title">MAIDC 医疗AI数据中心</h1>
          <p class="welcome-sub">临床 + 科研一体化多中心医疗AI平台</p>
        </div>

        <div class="ecg-wrap" aria-hidden="true">
          <svg class="ecg-svg" viewBox="0 0 1800 120" preserveAspectRatio="none">
            <path class="ecg-path ecg-glow" d="M0 60 H90 L104 60 112 38 122 82 132 30 142 74 150 52 158 60 H300 L314 60 322 38 332 82 342 30 352 74 360 52 368 60 H510 L524 60 532 38 542 82 552 30 562 74 570 52 578 60 H720 L734 60 742 38 752 82 762 30 772 74 780 52 788 60 H900 L914 60 924 38 934 82 944 30 954 74 962 52 970 60 H1110 L1124 60 1132 38 1142 82 1152 30 1162 74 1170 52 1178 60 H1320 L1334 60 1342 38 1352 82 1362 30 1372 74 1380 52 1388 60 H1530 L1544 60 1552 38 1562 82 1572 30 1582 74 1590 52 1598 60 H1800" />
            <path class="ecg-path" d="M0 60 H90 L104 60 112 38 122 82 132 30 142 74 150 52 158 60 H300 L314 60 322 38 332 82 342 30 352 74 360 52 368 60 H510 L524 60 532 38 542 82 552 30 562 74 570 52 578 60 H720 L734 60 742 38 752 82 762 30 772 74 780 52 788 60 H900 L914 60 924 38 934 82 944 30 954 74 962 52 970 60 H1110 L1124 60 1132 38 1142 82 1152 30 1162 74 1170 52 1178 60 H1320 L1334 60 1342 38 1352 82 1362 30 1372 74 1380 52 1388 60 H1530 L1544 60 1552 38 1562 82 1572 30 1582 74 1590 52 1598 60 H1800" />
          </svg>
        </div>

        <div class="feature-list">
          <div class="feature-card">
            <div class="feature-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5" rx="8" ry="3"/>
                <path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/>
                <path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/>
              </svg>
            </div>
            <div class="feature-text">
              <span class="feature-title">统一临床数据仓库</span>
              <span class="feature-sub">CDR · 全院数据整合治理</span>
            </div>
          </div>
          <div class="feature-card card-delay-1">
            <div class="feature-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a4 4 0 0 1 4 4c0 1.1-.45 2.1-1.17 2.83A4 4 0 0 1 17 12h3a2 2 0 0 1 2 2v3a2 2 0 1 1-4 0v-1H6v1a2 2 0 1 1-4 0v-3a2 2 0 0 1 2-2h3a4 4 0 0 1 2.17-3.17A3.99 3.99 0 0 1 8 6a4 4 0 0 1 4-4Z"/>
              </svg>
            </div>
            <div class="feature-text">
              <span class="feature-title">AI 模型全生命周期</span>
              <span class="feature-sub">训练 · 评估 · 部署 · 监控</span>
            </div>
          </div>
          <div class="feature-card card-delay-2">
            <div class="feature-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <circle cx="4" cy="6" r="2.2"/><circle cx="20" cy="6" r="2.2"/>
                <circle cx="4" cy="18" r="2.2"/><circle cx="20" cy="18" r="2.2"/>
                <path d="M5.8 7.4 9.8 10M18.2 7.4 14.2 10M5.8 16.6 9.8 14M18.2 16.6 14.2 14"/>
              </svg>
            </div>
            <div class="feature-text">
              <span class="feature-title">多中心安全协作</span>
              <span class="feature-sub">隐私计算 · 等保三级合规</span>
            </div>
          </div>
        </div>

        <div class="version-tag">v1.0.0</div>
      </div>
    </div>

    <!-- 右侧表单 -->
    <div class="login-right">
      <form class="login-form" onsubmit="return false">
        <div class="form-header">
          <h2 class="form-title">欢迎回来</h2>
          <p class="form-subtitle">请登录您的账户，继续今天的工作</p>
        </div>

        <div class="form-fields">
          <div class="field-group">
            <label class="field-label" for="login-username">用户名</label>
            <input id="login-username" type="text" class="field-input" placeholder="请输入用户名" autocomplete="username" />
          </div>
          <div class="field-group">
            <label class="field-label" for="login-password">密码</label>
            <div class="password-wrapper">
              <input id="login-password" type="password" class="field-input password-input" placeholder="请输入密码" autocomplete="current-password" />
              <button type="button" class="password-toggle" id="eyeBtn" aria-label="显示密码">
                <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="form-extra">
          <label class="remember-me"><input type="checkbox" checked /><span>记住我</span></label>
          <a class="forgot-link" href="javascript:void(0)">忘记密码?</a>
        </div>

        <button class="login-btn" type="submit">登 录</button>

        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">其他登录方式</span>
          <div class="divider-line"></div>
        </div>

        <button class="sso-btn" type="button">医院统一认证登录</button>

        <div class="security-hints">
          <p>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            您的登录行为将被审计记录
          </p>
          <p>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            连续5次登录失败将锁定账户30分钟
          </p>
        </div>

        <div class="footer-links">
          <span>© 2026 MAIDC</span>
          <span>·</span>
          <a href="javascript:void(0)">隐私政策</a>
          <span>·</span>
          <a href="javascript:void(0)">使用条款</a>
        </div>
      </form>
    </div>
  </div>

<script>
  const pwd = document.getElementById('login-password');
  const eyeBtn = document.getElementById('eyeBtn');
  const eyeIcon = document.getElementById('eyeIcon');
  const EYE_ON = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  const EYE_OFF = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  eyeBtn.addEventListener('click', () => {
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    eyeIcon.innerHTML = show ? EYE_OFF : EYE_ON;
    eyeBtn.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
  });
</script>
</body>
</html>
