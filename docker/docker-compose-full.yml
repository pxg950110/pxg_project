version: '3.8'

# Full MAIDC Stack - All Services
services:
  # ==================== Infrastructure ====================
  postgres:
    image: postgres:15-alpine
    container_name: maidc-postgres
    environment:
      POSTGRES_DB: maidc
      POSTGRES_USER: maidc
      POSTGRES_PASSWORD: maidc123
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maidc"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maidc-redis
    ports: ["6379:6379"]
    command: redis-server --requirepass maidc123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "maidc123", "ping"]
      interval: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: maidc-minio
    environment:
      MINIO_ROOT_USER: maidc
      MINIO_ROOT_PASSWORD: maidc123456
    ports: ["9000:9000", "9001:9001"]
    command: server /data --console-address ":9001"
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: maidc-rabbitmq
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: maidc
      RABBITMQ_DEFAULT_PASS: maidc123
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: maidc-nacos
    environment:
      MODE: standalone
      # 注意：不可设置 SPRING_DATASOURCE_PLATFORM=embedded —— v2.3.2 镜像中该值
      # 会被当作外部数据源开关（仅识别 mysql），导致 nacos 尝试连接
      # ${MYSQL_SERVICE_HOST} 而启动失败；不设置时默认即为内嵌 derby 存储
    ports: ["8848:8848", "9848:9848"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 15s
      retries: 5

  # ==================== Backend Services ====================
  gateway:
    build:
      context: ../maidc-parent
      dockerfile: maidc-gateway/Dockerfile
    container_name: maidc-gateway
    ports: ["8080:8080"]
    environment:
      NACOS_ADDR: nacos:8848
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      nacos: { condition: service_healthy }
      redis: { condition: service_healthy }

  app:
    build:
      context: ../maidc-parent
      dockerfile: maidc-app/Dockerfile
    container_name: maidc-app
    ports: ["8081:8081"]
    environment:
      NACOS_ADDR: nacos:8848
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/maidc?currentSchema=system,cdr,model,rdr,masterdata,audit,ods,public&stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: maidc
      SPRING_DATASOURCE_PASSWORD: maidc123
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  aiworker:
    build: ../maidc-parent/maidc-aiworker
    container_name: maidc-aiworker
    ports: ["8090:8090"]
    environment:
      # pydantic env_prefix=MAIDC_，compose 的 RABBITMQ_HOST 对 aiworker 无效
      MAIDC_RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
      # 专病知识库 LLM/RAG（OpenAI 兼容协议；留空则相关端点 503/降级）
      MAIDC_LLM_BASE_URL: ${MAIDC_LLM_BASE_URL:-}
      MAIDC_LLM_API_KEY: ${MAIDC_LLM_API_KEY:-}
      MAIDC_LLM_MODEL: ${MAIDC_LLM_MODEL:-gpt-4o-mini}
      MAIDC_EMBEDDING_MODEL: ${MAIDC_EMBEDDING_MODEL:-text-embedding-3-large}
      MAIDC_KB_PG_DSN: postgresql://maidc:maidc123@postgres:5432/maidc
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      postgres: { condition: service_healthy }

  # ==================== Frontend ====================
  portal:
    build: ../maidc-portal
    container_name: maidc-portal
    ports: ["3000:80"]
    depends_on:
      - gateway

volumes:
  pgdata:
  minio-data:
  rabbitmq-data:
